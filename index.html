<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Special One ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2b0938 0%, #591a4f 50%, #8a2387 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header-title {
      font-family: 'Sacramento', cursive;
      font-size: 2.5rem;
      background: linear-gradient(45deg, #ff9a9e, #fecfef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .sub-title {
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffd1d7;
      margin-bottom: 18px;
      font-weight: 600;
    }

    /* Audio Player Bar */
    .audio-card {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 50px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .song-info {
      text-align: left;
      overflow: hidden;
      margin-right: 8px;
    }
    .song-title {
      font-weight: 600;
      color: #ff9a9e;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.65rem;
      color: #ddd;
    }
    .play-btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(255, 65, 108, 0.4);
    }

    /* KOTAK MESEJ TEKS (DIBAIKI UNTUK AVOID OVERFLOW) */
    .message-box {
      background: #ffffff;
      color: #2d3436;
      padding: 18px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
      text-align: left;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      
      /* Tetapan Elak Teks Terpotong/Bertindih */
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      word-break: break-word !important;
      white-space: normal !important;
    }

    .action-btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 13px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 65, 108, 0.4);
      width: 100%;
      transition: transform 0.2s;
    }
    .action-btn:active {
      transform: scale(0.97);
    }

    /* Floating Emojis (Nailong & Capybara) */
    .floating-emoji {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 1;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body onclick="playAudioDirect()">

  <!-- Fail Audio Cinta Sesungguhnya -->
  <audio id="myAudio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-love-112199.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="header-title">For My Special One</div>
    <div class="sub-title">DATO' SRI ALIFF ❤️ DATIN SRI NURSYAMIMI</div>

    <!-- Music Player -->
    <div class="audio-card">
      <div class="song-info">
        <div class="song-title">Cinta Sesungguhnya ❤️</div>
        <div class="song-artist">Sabhi Saddi ft. Marsha</div>
      </div>
      <button class="play-btn" onclick="toggleAudio(event)" id="audioBtn">⏸ Pause Lagu</button>
    </div>

    <!-- Kotak Mesej Yang Kemas -->
    <div class="message-box">
      sayangg, i know kamuu penat tokeyy?. dahh kalauu penat rehat tauu.. 😘<br><br>
      ❤️ saya alwayss ada dengann sayangg tauu. alwayss support sayangg. 🥺❤️ love youu so muchhh
    </div>

    <button class="action-btn" onclick="openSecret()">Buka Peti Rahsia 🎁</button>
  </div>

  <script>
    const audio = document.getElementById('myAudio');
    const audioBtn = document.getElementById('audioBtn');
    let isPlaying = false;

    // Auto play muzik bila skrin disentuh
    function playAudioDirect() {
      if (!isPlaying) {
        audio.play().then(() => {
          audioBtn.innerText = "⏸ Pause Lagu";
          isPlaying = true;
        }).catch(() => {});
      }
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      if (audio.paused) {
        audio.play();
        audioBtn.innerText = "⏸ Pause Lagu";
        isPlaying = true;
      } else {
        audio.pause();
        audioBtn.innerText = "▶ Play Lagu";
        isPlaying = false;
      }
    }

    function openSecret() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
      alert("I love you so much Datin Sri Nursyamimi! ❤️✨");
    }

    // Hujan Capybara (🦫), Nailong Kuning (🟡) & Hati (❤️)
    setInterval(() => {
      const emoji = document.createElement('div');
      emoji.classList.add('floating-emoji');
      const items = ['🦫', '🟡', '❤️', '✨', '💖'];
      emoji.innerText = items[Math.floor(Math.random() * items.length)];
      emoji.style.left = Math.random() * 90 + 'vw';
      emoji.style.fontSize = (Math.random() * 12 + 18) + 'px';
      emoji.style.animationDuration = Math.random() * 3 + 3 + 's';
      document.body.appendChild(emoji);

      setTimeout(() => emoji.remove(), 5000);
    }, 600);
  </script>

</body>
</html>
