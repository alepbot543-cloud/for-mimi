<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #4a4a4a;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 10;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-family: 'Sacramento', cursive;
      font-size: 2.8rem;
      color: #ff4b2b;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 20px;
    }
    .img-container {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .img-container img:hover {
      transform: scale(1.05);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
      transition: all 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
    }
    button:active {
      transform: scale(0.98);
    }
    /* Heart particle effect */
    .heart {
      position: fixed;
      font-size: 20px;
      top: -20px;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 1;
    }
    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">Hey Pretty Girl ❤️</h1>
    <div class="img-container">
      <!-- Tukar gambar korang kat sini -->
      <img id="main-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500" alt="Sweet Moment">
    </div>
    <p id="text">Terima kasih sebab sentiasa ada dengan aku. Life aku jadi jauh lebih bermakna dan manis bila ada kau. Don't forget to smile today! ✨</p>
    
    <div class="btn-group">
      <button onclick="nextMessage()">Tekan Sini 💌</button>
    </div>
  </div>

  <script>
    const data = [
      {
        title: "Kenyataan Hari Ini 🌹",
        text: "Kau tahu tak? Dalam ramai-ramai orang, kau sorang je yang boleh buat aku senyum sorang-sorang bila teringat kat kau.",
        img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=500"
      },
      {
        title: "Janji Aku ✨",
        text: "Aku mungkin tak sempurna, tapi aku janji akan sentiasa cuba yang terbaik untuk jaga dan hargai kau.",
        img: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=500"
      },
      {
        title: "I Love You! ❤️",
        text: "Mimi, stay cute, stay sweet, and stay with me okay? Love you so much!",
        img: "https://images.unsplash.com/photo-1518895949257-7621c3c786d7?q=80&w=500"
      }
    ];

    let index = 0;

    function nextMessage() {
      index = (index + 1) % data.length;
      
      const card = document.querySelector('.card');
      card.style.opacity = '0';
      card.style.transform = 'translateY(10px)';
      
      setTimeout(() => {
        document.getElementById('title').innerText = data[index].title;
        document.getElementById('text').innerText = data[index].text;
        document.getElementById('main-img').src = data[index].img;
        
        card.style.transition = 'all 0.5s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, 300);

      createFloatingHearts(5);
    }

    function createFloatingHearts(count) {
      const hearts = ['❤️', '💖', '🌸', '✨', '💕'];
      for(let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 2 + 's';
        heart.style.fontSize = Math.random() * 15 + 15 + 'px';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }
    }

    setInterval(() => createFloatingHearts(1), 800);
  </script>
</body>
</html>
